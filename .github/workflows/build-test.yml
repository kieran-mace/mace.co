# Build and Test Workflow for Quarto + R (renv) + Python (reticulate)
#
# This workflow demonstrates the proper setup for a Quarto project that uses:
# - R packages managed by renv
# - Python packages called from R via reticulate
# - requirements.txt for Python dependency tracking
#
# Key insight: Python must be set up BEFORE renv, so reticulate knows
# which Python to use. The RETICULATE_PYTHON env var tells reticulate
# to use the CI's Python instead of the local virtualenv path in renv.lock.
#
# Order of operations:
# 1. Checkout
# 2. Setup Python + install packages (BEFORE R/renv)
# 3. Set RETICULATE_PYTHON
# 4. Setup R
# 5. Setup renv (now aware of Python)
# 6. Install Quarto
# 7. Render

name: Build and Test

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # PYTHON SETUP - Must come BEFORE R/renv
      # ============================================================
      # reticulate needs to know which Python to use before renv loads.
      # We use Python 3.12 (stable) and install packages from requirements.txt.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'  # Cache pip packages for faster builds

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Tell reticulate to use the CI's Python, not the local virtualenv
      # path stored in renv.lock (which doesn't exist in CI)
      - name: Configure Python for reticulate
        run: |
          echo "RETICULATE_PYTHON=$(which python)" >> $GITHUB_ENV

      # ============================================================
      # R SETUP - After Python is configured
      # ============================================================

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'
          use-public-rspm: true  # Use Posit Package Manager for pre-compiled binaries

      # Install system dependencies required by R packages
      # (RCurl needs libcurl, sf needs gdal/geos/proj, etc.)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev \
            libmagick++-dev

      - name: Set up renv
        uses: r-lib/actions/setup-renv@v2

      # ============================================================
      # QUARTO SETUP AND RENDER
      # ============================================================

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.4.553'

      - name: Render Quarto site
        run: quarto render

      # ============================================================
      # VALIDATION AND ARTIFACTS
      # ============================================================

      - name: Check build output
        run: |
          if [ ! -d "_site" ]; then
            echo "Error: _site directory not created"
            exit 1
          fi
          if [ ! -f "_site/index.html" ]; then
            echo "Error: index.html not created"
            exit 1
          fi
          echo "Build successful!"
          ls -la _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
